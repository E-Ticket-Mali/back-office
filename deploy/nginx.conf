# SPA : toute URL inconnue sert index.html (le routeur React prend le relais), comme la règle
# `/* → /index.html` du netlify.toml actuel.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Fichiers fingerprintés par Vite : cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html jamais mis en cache, pour qu'un déploiement soit visible immédiatement.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
